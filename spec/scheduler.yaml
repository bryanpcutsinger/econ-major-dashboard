# Step 11: scheduler, probe, keep-alive, alarm, runner build (data plan section 3, row 11; section 4).
# Written 2026-10-26 BEFORE any step-11 code, from the private plan step11-plan.md (two blind legs + synthesis)
# and the instructor's rulings of 2026-10-26. Lines marked AMENDED change after the first code or runs.
# Done check (plan): a forced "new vintage" dry run goes probe -> build -> publish -> issue on the runner,
# without harming the live page.

rulings_2026_10_26:
  pairing: "a new vintage = the 1-year Y+1 AND the 5-year (Y-3)..(Y+1) both out; one alone = 'pending' (one dollar year)"
  term_freeze: "1/12-4/29: the bot builds and holds with a 'ready' issue; the instructor publishes by dispatch. Outside the
                term: auto-publish (C2)"
  revisions: "a changed source for a published vintage holds; publish by dispatch after review"
  publish_path: "direct bot commit to main"
  onet: "release 30.2 and the 8digit_mean link stay fixed"
  fix_rebuilds: "by dispatch only; 'no new Census data' wording; no announcement draft"
  alarm: "D7: a Claude routine reads the public data/last-checked.json, weekly (was monthly)"
  start: "D8: arm the cron after the 1/12/2027 lecture"

# ---------- 11.1: one vintage config; inputs the runner can fetch ----------
vintage:
  file: "spec/vintage.json: {acs1: Y, acs5: [Y-4, Y], onet_release, onet_link, puma_vintage}"
  override: "env DASHBOARD_VINTAGE=<path> (the runner's dry run and rehearsals); the tracked file = the published vintage"
  derived: "scripts/vintage.py derives every path, file name, URL, bundle prefix, and manifest label from it: raw/acs1-{Y},
            raw/acs5-{A}-{B}, the two data dictionaries, SOCP-{Y}.json, cache/acs5-{A}-{B}-ba.parquet,
            output/panels/rank-{Y}*.json, compare-{Y}.json, bundle prefix {Y}-1yr_{A}-{BB}-5yr_, years and dollars labels"
  read_from_data: "ADJINC (one per 1-year file, asserted; per survey year in the 5-year file)"
  fixed: "every spec rule (ages, SCHL, ESR, D-rulings, D5 and the count rule, 1.645, SDR 80), spec/major73.csv,
          South Florida (H4 holds a change), O*NET 30.2 + 8digit_mean, the H8 dictionary baseline (no auto-rebaseline).
          The $5,500 pay floor stays as each spec states it: nominal WAGP in the rank build (NY Fed replication),
          2024-dollar pay in the 5-year build (spec/acs5-panels.yaml); parameterizing must not 'harmonize' it"
inputs:
  file: "spec/inputs.json: for each vintage, every input the build reads: path under raw/, url, bytes, sha256"
  fetch: "scripts/fetch_inputs.py: present with the right sha -> skip; missing -> download, then check the sha; a
          mismatch -> exit 2, no file kept (11.3 maps it to a gate-hold issue). --pums adds the two PUMS zips (sha from
          spec/sources.json for a published vintage)"
  record: "scripts/fetch_inputs.py --record writes the entries for the current vintage from local files (a human step,
           when a new vintage is accepted)"
  list: ["PUMS 1-year and 5-year national person zips (--pums)", "PUMS data dictionaries (1-year, 5-year)",
         "SOCP code list (Census API metadata, no key)", "O*NET db_{release}_text.zip", "2020 tract-to-PUMA file"]
  not_needed: "the NY Fed CSV (E45: names from spec/major73.csv); the HC package (E45: Census labels); benchmarks for the
               replication checks (audit only, not run on the runner)"
  packages: "requirements.txt adds pyarrow (the build reads and writes Parquet). A hashed lockfile comes with the
             build job (11.7; AMENDED, was 11.5), pinned to the runner's Python"
done_check_11_1: "with the tracked spec/vintage.json, a rebuild from the clean tree gives the live bundle id
                  (2024-1yr_2020-24-5yr_6f8bddb5-27bdb9) with byte-identical data files; tests pass; fetch_inputs.py into
                  an empty raw/ copy downloads every non-PUMS input and every sha matches; a 2022 rank rehearsal
                  (DASHBOARD_VINTAGE with acs1 = 2022) runs on the local 2022 file"

# ---------- 11.2-11.9 (from the plan; detail added when each starts) ----------
probe_11_2:                    # detail written 2026-10-26 before the probe code
  script: "scripts/probe.py [--out probe.json] [--fixture <json>]; stdlib only, no key; exit 0 for every decision
           except error (exit 1), so the workflow branches on the JSON, not on the exit code"
  live: "for each source in the live bundle's manifest: HEAD the zip (Content-Length, Last-Modified); GET its data
         dictionary (~330 KB) and hash it. The record to compare: the live manifest's source_records if present,
         else spec/sources.json (bundles built before 11.2 have no source_records)"
  next: "the vintage one year on (1-year Y+1; 5-year A+1..B+1): HEAD both zips and both dictionaries; GET the Census
         API pums.json for Y+1 (acs1, acs5) as a second signal (recorded, not decisive)"
  present: "a zip counts as present only with status 200 and Content-Length > 10 MB; a dictionary with status 200; 404 =
            not out yet (normal)"
  error: "any timeout, connection error, 403, 429, 5xx, or a live HEAD without Content-Length or Last-Modified; never
          read as 'nothing'. Each request: 2 retries with a short pause"
  decision_order: "error > revision_suspect > new_vintage > pending > nothing; every reason listed"
  revision_suspect: "a live zip's bytes or Last-Modified differ from the record, or a live dictionary's sha256 differs.
                     If the zip's bytes and Last-Modified equal a confirmed fingerprint in data/last-checked.json
                     (confirmed: {sid: {bytes, last_modified, sha256}}, written after a same-sha download in 11.5/11.7),
                     it is not a suspect and the probe emits that sha256, so H9 takes its sha branch"
  new_vintage: "both next zips present and both next dictionaries present (pairing rule)"
  pending: "some but not all of the next files present"
  output: "{version: 1, probed_at, vintage, live_bundle, sources: {sid: {url, bytes, last_modified, sha256 | null,
           dictionary_sha256, dictionary_changed}}, next: {name: {url, status, bytes, last_modified}}, api: {...},
           decision, reasons, errors}; the sources keys are the raw folder ids H9 reads"
  provenance: "fetch_inputs.py --pums writes raw/<sid>/PROVENANCE.txt (url, bytes, Last-Modified, sha256, accessed) for
               each zip it downloads, so a runner build can record source_records in its manifest"
  fixtures: "a fixture maps url -> {status, headers, body} (body as text, or a sha256 to fake a dictionary); a missing
             url raises a connection error. Tests: nothing, pending, new_vintage, revision_suspect (zip), dictionary
             changed, confirmed re-upload, live 5xx, next 5xx, missing header; H9 passes the unchanged probe and
             holds the revised one"
  done_check: "the tests above pass; one live probe (network: HEAD + about 1.3 MB of dictionaries) gives a decision with
               no error, and H9 run with its output passes against the live bundle"
probe: "scripts/probe.py, stdlib only, no key: HEAD the live zips and the next vintage's zips; GET both dictionaries;
        Census API pums.json as a second signal. Decision: error / nothing / pending / new_vintage / revision_suspect.
        A transport error is 'error', never 'nothing'. Output keys = raw folder ids (H9 input). A suspect is settled by
        sha after download: same sha = re-upload (no rebuild, no issue); new sha = revision (hold)"
issues_11_3:                   # detail written 2026-10-26 before the issue code
  kinds: "from the candidate and live manifests, never a flag: years differ (or no live bundle) -> new-data (with the
          announcement draft); same years, a source sha differs -> revision-published (announcement: 'Census revised');
          same years and sources -> rebuild ('No new Census data'; no announcement). Holds: gate-hold, revision (H9 alone
          failed), ready (term freeze). Others: stale, failure (the probe said error, or a run step failed)"
  term_freeze: "spec/term.json lists teaching terms {name, start, end}; inside one, gates that pass do NOT flip
                current.json: publish renders 'ready' (change list + how to publish) and exits 0. A dispatch with
                publish-in-term (publish.py --publish-in-term) flips it. Spring 2027 = 2027-01-12 .. 2027-04-29"
  accept_revision: "publish.py --accept-revision SID=SHA256 (a dispatch input, after review): H9 accepts that sha for that
                    source; the issue kind is then revision-published"
  keys: "each body ends with <!-- dashboard-key: KEY -->. publish:<bundle> (new-data, rebuild, revision-published);
         hold:<candidate>:<failed gates>; revision:<sid>:<bytes>:<Last-Modified> (from the probe, before any download);
         ready:<candidate>; stale:<live>; failure:<YYYY-MM>:<step>"
  post: "scripts/issues.py: title, body, key, labels (data-bot + the kind; [DRY RUN] title prefix and a dry-run label in a
         dry run). Before posting: gh issue list --label data-bot --state all --json number,title,body --limit 200; a
         matching key -> post nothing. gh issue create --title --body-file --label (GH_TOKEN). The gh call is injectable;
         11.3 tests use a stub. Real posting starts at 11.8, on the instructor's yes"
  done_check: "tests: each kind's title and wording (rebuild has no announcement; new-data has one); term freeze holds
               the flip and a publish-in-term run flips it; accept-revision publishes a revised source; a repeat key
               posts nothing; a new key calls gh issue create once; existing step-9 tests still pass"
stale_note_11_4:               # detail written 2026-10-26 before the page code
  file: "data/last-checked.json (written by the keep-alive job, 11.5): {last_attempt, last_success, decision, live,
         run_url, confirmed}; times in UTC ISO 8601. last_success = the last run whose probe gave a decision other
         than error"
  states: "missing (HTTP 404: the scheduler is not armed yet, D8) -> no note, no footer date; unreadable (any other
           failure, bad JSON, or no valid last_success) -> note 'could not confirm when this page last checked';
           readable and last_success more than 45 days before the viewer's clock -> note with that date; otherwise
           no note and the footer says 'Last checked for new data: <date>'"
  place: "a short note at the top of every panel (each Canvas frame shows it) and the footer date"
  logic: "one pure function staleNote(lastChecked, now) in app.js, exposed as window.EMD.staleNote for tests;
          window.EMD_NO_START = true loads app.js without starting the page (test page only)"
  done_check: "tests/site/stale.html (headless Chrome): missing -> none; unreadable -> note; 30 days -> none and a date;
               50 days -> note; bad date -> note; harness PASS"
workflow_11_5:                 # detail written 2026-10-26 before the workflow (instructor yes 2026-10-26: bot commits to
                               # main; a few dispatch test runs; the cron stays off until 11.9, D8)
  file: ".github/workflows/data-check.yml"
  triggers: "workflow_dispatch only (mode: probe-only). The schedule '17 13 3 * *' is written but commented out; 11.9
             arms it after the 1/12/2027 lecture"
  actions: "one outside action, actions/checkout v7.0.1 pinned by full SHA 3d3c42e5aac5ba805825da76410c181273ba90b1;
            probe and keep-alive are stdlib Python on the runner's own python3 (no setup-python). The hashed lockfile
            moves to 11.7 (AMENDED: was 11.5), where the build first needs numpy, pandas, pyarrow"
  permissions: "top level {}; probe: contents read, checkout without persisted credentials; keepalive: contents write,
                actions write (the enable call), pages write (the build request)"
  hand_off: "the probe job passes probe.json to keepalive as a base64 job output (no artifact action)"
  keepalive: "always runs after probe (if: always()). scripts/keepalive.py writes data/last-checked.json: last_attempt,
              last_success (advances only when the decision is not error), decision, first reasons and errors, live,
              run_url, confirmed (carried over). A missing or unreadable probe output = decision error. Commit as
              github-actions[bot]; push with one rebase retry; then PUT the workflow's enable endpoint (whether this
              resets the 60-day timer: UNCERTAIN, logged only)"
  pages: "after the push: poll GET /pages/builds/latest for the pushed commit for 90 s; if no build for it, POST
          /pages/builds and poll again (up to 4 min); the job summary and the ledger record which case held.
          AMENDED 2026-10-26 (E52): in all three test runs the bot's push started the legacy Pages build by itself
          (the Codex-cited claim that a GITHUB_TOKEN push does not was wrong for this repo); the check now waits for
          status 'built' and keeps the POST request as the fallback"
  limits: "concurrency group data, no cancel; timeouts probe 10 min, keepalive 10 min; ubuntu-24.04"
  done_check: "keepalive.py unit tests (success, error keeps last_success, bad probe output, confirmed carried); a
               dispatch run goes green; main gets one bot commit with data/last-checked.json; the live site serves it
               (the page then shows 'Last checked for new data: <date>'); the Pages case recorded; a forced probe error
               run commits decision error with last_success unchanged"
build_11_7:                    # detail written 2026-10-26 before the build job (instructor yes 2026-10-26: ~2.9 GB of
                               # Census downloads on the GitHub runner per build)
  memory: "extract_acs5.py casts PWGTP and PWGTP1-80 to int32 in each kept chunk before the concat (the final cast was
           already int32), so the cache is byte-identical and the peak is lower. Measured here before and after"
  lockfile: "requirements.lock: numpy 2.0.2, pandas 2.3.3, pyarrow 18.1.0 and their dependencies at the versions
             installed here, every file hash from the PyPI JSON API (no wheel downloaded here); the runner makes a venv on
             its own python3 (3.12 on ubuntu-24.04) and installs with --require-hashes"
  job: "mode build-only: job build (contents read, no secrets, 180 min): free disk (remove preinstalled toolchains),
        venv + locked install, fetch_inputs.py --pums, extract, rank build, 5-year build, each step under
        /usr/bin/time -v; the summary lists elapsed time, peak memory (max RSS), and free disk after each step; then
        cmp of each data file against the live bundle, the bundle id, and the gates vs live with the dictionaries
        and a fresh probe. Nothing is published, committed, or uploaded"
  done_check: "the run goes green in under 3 h; free disk never below 4 GB on a 14 GB budget (we use < 10 GB); peak
               memory logged; bundle id = the live one or, if not, the change list explains the difference (a Mac ->
               Linux float difference is logged in the ledger, not a failure)"
h9_baseline: "each bundle manifest records url, bytes, Last-Modified, sha256 per source; H9 compares the probe with the
              live manifest; bundles without the fields fall back to spec/sources.json. The bot never rewrites spec/"
issues: "kinds from the manifests: new vintage (with announcement draft) / rebuild with the same data ('no new Census
         data', no announcement) / revision / gate hold / ready (term freeze) / stale / dry run; a hidden key per body
         for de-duplication; gh issue create with GITHUB_TOKEN"
stale_note: "the page computes days since last_success in data/last-checked.json; over 45 days, or if the file cannot
             be read, it shows when it last checked. This is the layer that must hold if the others fail"
workflow: "one workflow (a GITHUB_TOKEN push starts no new run): probe (contents: read), keepalive (contents: write),
           build (contents: read, no secrets), publish (contents: write, issues: write). Actions pinned by SHA;
           ubuntu-24.04; concurrency without cancel; timeouts 10 / 5 / 180 / 15 min. Cron '17 13 3 * *' + dispatch
           (mode: normal | probe-only | dry-run; fixture: none | new-vintage | revision | hold)"
pages: "every bot push (keep-alive and publish) is followed by POST /pages/builds and a check of the deployed commit,
        unless 11.5 shows a GITHUB_TOKEN push rebuilds legacy Pages by itself; both jobs then need pages: write"
dry_run: "fixture new-vintage names the real 2024 files as new; the runner rebuilds from zero; publish runs on a scratch
          data copy whose current.json names bundle v1, so the gates and the flip really run; push to dryrun/<run id>;
          one [DRY RUN] issue posted and closed; live current.json unchanged; a second dispatch proves de-dup; a hold
          fixture proves the hold issue. It cannot prove the real 2025 layout, codes, or timing"
asks: "push and contents: write (granted for this work 2026-10-26); the D7 routine (create: ask); ~2.9 GB CI download per
       build (ask at 11.7); issue posting (ask at 11.8)"
